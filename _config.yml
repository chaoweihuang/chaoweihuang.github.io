# Site settings
title: Chao-Wei Huang
description: Personal website of Chao-Wei Huang, Ph.D. from National Taiwan University
url: "https://chaoweihuang.github.io"
baseurl: ""

# Author info
author:
  name: Chao-Wei Huang
  email: chaoweihuang.us@gmail.com
  bio: "Ph.D., National Taiwan University"

# Social links
social:
  github: chaoweihuang
  linkedin: chao-wei-huang-89933a163
  twitter: cwhuang_wh
  scholar: nmsPLncAAAAJ

# Resume
resume_path: /assets/pdf/ChaoWei_resume_20241017.pdf

# Analytics
google_analytics: G-SEL0950V43

# Build settings
markdown: kramdown
highlighter: rouge

# Sass
sass:
  style: compressed
  sass_dir: _sass

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

# Pagination
paginate: 10
paginate_path: "/blog/page:num/"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .claude

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "page"
