<footer class="footer">
  <div class="container">
    <div class="footer-content">
      <div class="footer-copyright">
        &copy; {{ site.time | date: '%Y' }} {{ site.author.name }}
      </div>
      <div class="footer-links">
        {% if site.social.github %}
        <a href="https://github.com/{{ site.social.github }}" target="_blank" rel="noopener" aria-label="GitHub">
          <i class="bi bi-github"></i>
        </a>
        {% endif %}
        {% if site.social.linkedin %}
        <a href="https://linkedin.com/in/{{ site.social.linkedin }}" target="_blank" rel="noopener" aria-label="LinkedIn">
          <i class="bi bi-linkedin"></i>
        </a>
        {% endif %}
        {% if site.social.twitter %}
        <a href="https://x.com/{{ site.social.twitter }}" target="_blank" rel="noopener" aria-label="X (Twitter)">
          <i class="bi bi-twitter-x"></i>
        </a>
        {% endif %}
        {% if site.social.scholar %}
        <a href="https://scholar.google.com/citations?user={{ site.social.scholar }}" target="_blank" rel="noopener" aria-label="Google Scholar">
          <i class="ai ai-google-scholar"></i>
        </a>
        {% endif %}
      </div>
    </div>
  </div>
</footer>
