<footer class="footer mt-auto py-4 bg-light">
  <div class="container">
    <div class="row">
      <div class="col-md-6">
        <p class="mb-2">&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}</p>
      </div>
      <div class="col-md-6 text-md-end">
        <div class="social-links">
          {% if site.social.github %}
          <a href="https://github.com/{{ site.social.github }}" target="_blank" rel="noopener" aria-label="GitHub" class="me-3">
            <i class="bi bi-github fs-5"></i>
          </a>
          {% endif %}
          {% if site.social.linkedin %}
          <a href="https://linkedin.com/in/{{ site.social.linkedin }}" target="_blank" rel="noopener" aria-label="LinkedIn" class="me-3">
            <i class="bi bi-linkedin fs-5"></i>
          </a>
          {% endif %}
          {% if site.social.twitter %}
          <a href="https://x.com/{{ site.social.twitter }}" target="_blank" rel="noopener" aria-label="X (Twitter)" class="me-3">
            <i class="bi bi-twitter-x fs-5"></i>
          </a>
          {% endif %}
          {% if site.social.scholar %}
          <a href="https://scholar.google.com/citations?user={{ site.social.scholar }}" target="_blank" rel="noopener" aria-label="Google Scholar" class="me-3">
            <i class="ai ai-google-scholar fs-5"></i>
          </a>
          {% endif %}
          {% if site.author.email %}
          <a href="mailto:{{ site.author.email }}" aria-label="Email">
            <i class="bi bi-envelope fs-5"></i>
          </a>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</footer>
